<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-title {
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="card">
            <img src="https://thumbs.dreamstime.com/b/ocean-coastal-cliffs-landscape-21867786.jpg" alt="Ocean Coastal Cliffs Landscape">
            <div class="card-title">Photo 1</div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_nVoJMkj-d4qNz93pv5L5TRJzQVqcGYpTlcd8OtMJS7MxZAckQx0jlYVM&s=10" alt="Image 2">
            <div class="card-title">Photo 2</div>
        </div>
        <div class="card">
            <img src="https://thumbs.dreamstime.com/b/d-tas-cradle-mt-peak-tele-square-pan-mountain-national-park-tasmania-aerial-scenic-landscape-panorama-453913654.jpg" alt="Cradle Mountain Landscape">
            <div class="card-title">Photo 3</div>
        </div>
        <div class="card">
            <img src="https://thumbs.dreamstime.com/b/tropical-rice-field-mountain-square-nature-composition-square-tropical-composition-featuring-lush-green-rice-fields-palm-trees-458831535.jpg" alt="Tropical Rice Field Landscape">
            <div class="card-title">Photo 4</div>
        </div>
        <div class="card">
            <img src="https://thumbs.dreamstime.com/b/ocean-sunset-wave-inspirational-breaking-water-flowing-nature-scenic-surreal-rock-sunrise-dramatic-landscape-seascape-colorful-450044018.jpg" alt="Ocean Sunset Landscape">
            <div class="card-title">Photo 5</div>
        </div>
        <div class="card">
            <img src="https://www.onlandscape.co.uk/wp-content/uploads/2012/01/IMG_0043.jpg" alt="On Landscape Photo">
            <div class="card-title">Photo 6</div>
        </div>
        <div class="card">
            <img src="https://amateurphotographer.com/wp-content/uploads/sites/7/2022/05/crop5.jpg?w=900" alt="Amateur Photographer Image">
            <div class="card-title">Photo 7</div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSC8SPPqhiO67Jd90jMzopZP4FztY_R9X_-td2DjYYk1Q&s=10" alt="Image 8">
            <div class="card-title">Photo 8</div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS8IfNMvYIy4RvdGRtLaCsVPrH9SNyBtn1-FdcNQ8Pj3wnWV-HR4QgQe2de&s=10" alt="Image 9">
            <div class="card-title">Photo 9</div>
        </div>
    </div>
</body>
</html>
